id: motto
version: 0.1.0
kind: conversation
sector: interview
title: Motto

purpose: >
  Your favorite saying — the one you actually use. A motto is almost always
  advice you gave yourself, and it usually spells out, nearly word for word,
  your own strategy for getting to what's next. At the very end of all this it
  comes back to you. Right now we just write it down.

purpose_i18n:
  ru: >
    Твоя любимая поговорка — та, которой ты правда пользуешься. Девиз почти
    всегда оказывается советом, который ты дал себе сам, и обычно почти дословно
    описывает твою же стратегию перехода к следующей главе. В самом конце всего
    пути он вернётся к тебе. Сейчас мы его просто записываем.

consumes:
  - counseling_goal

invalidates:
  - advice_to_self

elicit:
  persona: |
    Light and appreciative — this is a short one, and it should feel short.
    People often smile at this question; let them, and don't talk over it. One
    question at a time.
  guardrails:
    - Any saying counts — proverb, song lyric, family phrase, something a coach
      once said. Never rate or improve it.
    - If the user has no motto, composing one right now is fully valid — the
      book treats a saying created in the moment as equally revealing.
    - Do not interpret the motto during the conversation; collect only.
  stages:
    - id: elicit
      goal: One favorite saying or motto, in the user's exact wording.
      opening: >
        Tell me your favorite saying or motto.
      opening_i18n:
        ru: >
          Назови свою любимую поговорку или девиз.
      probes:
        - when: the user cannot think of one
          then: Ask about a saying they remember hearing that stuck with them.
        - when: still nothing comes
          then: Invite them to make one up right now — the advice they would
            put on a card for themselves at this moment in their life.
        - when: several sayings are offered
          then: Ask which one they would keep if they could keep only one.
      done_when:
        - The user has stated one saying or motto.
    - id: anchor
      goal: A touch of origin or context, asked once.
      opening: >
        Where does that one come from — or when does it usually come to mind?
      done_when:
        - The user has answered once, in any way.

induce:
  steps:
    - id: extract
      task: Record the motto exactly as stated, with its origin if given.
      model_tier: small
      temperature: 0.2
      output_schema:
        type: object
        required: [motto, origin, when_it_surfaces]
        properties:
          motto: { type: string, x-verbatim: true }
          origin:
            type: ["string", "null"]
            x-verbatim: true
            description: Where the saying comes from, in the user's words; null if not shared.
          when_it_surfaces:
            type: ["string", "null"]
            x-verbatim: true
            description: When it comes to mind, in the user's words; null if not shared.

confirm:
  present: structured_review
  authorize_language: >
    Your saying, word for word. Fix it if even one word is off — you'll hear it
    again at the end, so it should be exactly yours.

  authorize_language_i18n:
    ru: >
      Твоя поговорка, слово в слово. Поправь, если хотя бы одно слово не то, —
      ты услышишь её снова в конце, так что она должна быть в точности твоей.

artifact:
  schema:
    type: object
    required: [motto]
    properties:
      motto: { type: string }
      origin: { type: ["string", "null"] }
      when_it_surfaces: { type: ["string", "null"] }
  render: |
    “{{motto}}”
