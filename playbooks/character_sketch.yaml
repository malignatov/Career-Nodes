id: character_sketch
version: 0.1.0
kind: derived
sector: induction
title: Character sketch

purpose: >
  A short picture of who you are, built only from words you already approved
  when you talked about the people you looked up to. What you admired in them
  is the blueprint you used to build yourself — and those qualities are there
  to solve something that worried you early on. Courage exists to answer fear.
  If you've already worked out how you see things, this gets framed that way.
  Nothing is invented: every trait is a quote of your own words, and you edit
  the result.

purpose_i18n:
  ru: >
    Короткая картина того, кто ты, — собранная только из слов, которые ты уже
    принял, когда рассказывал о людях, на которых равнялся. То, что тебе в них
    нравилось, и есть чертёж, по которому ты себя собрал, — и эти качества
    существуют, чтобы решать то, что тревожило тебя в самом начале. Смелость
    нужна, чтобы отвечать страху. Если ты уже разобрался, как смотришь на вещи,
    картина выстраивается с этого ракурса. Ничего не выдумано: каждая черта —
    цитата твоих собственных слов, и результат правишь ты.

consumes:
  - role_models
  - perspective
  - counseling_goal

invalidates:
  - script
  - life_portrait

induce:
  steps:
    - id: sketch
      task: >
        Compose a second-person character sketch of four to eight sentences,
        addressed to the user ("You are…"), from the role_models artifact.
        Anchor it on the primacy trait (weight it most) and the repeated
        traits. Quote the user's descriptor words rather than substituting
        synonyms. Show with concrete phrasing instead of abstract labels. If a
        perspective artifact is present, frame the traits as the solution the
        user constructed to the preoccupation it names — the way bravery solves
        fear. If two traits sit in tension, keep the tension visible rather
        than smoothing it over. Name explicitly how the anchor trait may also
        work against the user in their present situation — the admired
        strength read honestly as the very thing that can keep them stuck.
        Never add a trait the user did not state.
      model_tier: large
      output_schema:
        type: object
        required: [sketch, core_traits, solves]
        properties:
          sketch:
            type: string
            description: The portrait prose, second person.
          core_traits:
            type: array
            minItems: 2
            items: { type: string, x-verbatim: true }
            description: The trait words the sketch is built on, quoted exactly.
          solves:
            type: ["string", "null"]
            description: The preoccupation these traits answer, when the
              perspective artifact is available; otherwise null.

confirm:
  present: structured_review
  authorize_language: >
    Assembled only from your own words. Reword anything that doesn't sound like
    you — what comes next builds on it.

  authorize_language_i18n:
    ru: >
      Собрано только из твоих слов. Переформулируй всё, что звучит не как ты, —
      дальше строится на этом.

artifact:
  schema:
    type: object
    required: [sketch, core_traits]
    properties:
      sketch: { type: string }
      core_traits: { type: array, items: { type: string } }
      solves: { type: ["string", "null"] }
  render: |
    {{sketch}}
