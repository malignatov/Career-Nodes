id: life_portrait
version: 0.1.0
kind: derived
sector: portrait
title: Life portrait

purpose: >
  Everything you've approved, assembled into one long story. The small stories
  you told hold together, and they come in a fixed order: the angle you keep
  returning to, the self you built to meet it, the places that suit you, the
  plot you're drawn to, the advice you already carry, and a version of the
  future that answers the very thing you walked in with. It's written from your
  words and your metaphors. It leans hopeful without flattering you. And it
  stays a draft until you say otherwise — you're the author here.

purpose_i18n:
  ru: >
    Всё, что ты принял, собранное в одну большую историю. Маленькие истории,
    которые ты рассказал, держатся вместе — и идут в фиксированном порядке:
    ракурс, к которому ты возвращаешься; «я», которое ты выстроил ему навстречу;
    места, которые тебе подходят; сюжет, который тебя тянет; совет, который ты
    уже носишь с собой; и версия будущего, которая отвечает ровно на то, с чем
    ты пришёл. Написано твоими словами и твоими же образами. Клонится к надежде,
    но не льстит. И остаётся черновиком, пока ты не скажешь иначе, — автор здесь
    ты.

consumes:
  - perspective
  - character_sketch
  - preferred_settings
  - script
  - advice_to_self
  - counseling_goal

invalidates:
  - identity_statement
  - action_recipe

induce:
  steps:
    - id: compose
      task: >
        Compose the life portrait from the authorized artifacts, in six titled
        movements of a few sentences each, second person throughout, then join
        them into one continuous portrait text. Movement 1 — perspective: the
        "one damn thing" the user faces again and again, opened with feeling.
        Movement 2 — self: the character built to meet it, quoting the user's
        admired descriptor words; show, don't tell. Movement 3 — setting: the
        places, people, problems, and procedures that hold this self.
        Movement 4 — script: the storyline that unites self and setting,
        keeping the transformative scene visible. Movement 5 — advice: the
        user's motto as the direction the author-self gives the actor-self,
        quoted exactly. Movement 6 — future scenario: restate the user's
        original request, then answer it — how the career theme extends the
        plot in a fitting direction, turning preoccupation toward occupation.
        Rules: use the user's words and metaphors wherever they exist; keep
        tensions visible rather than smoothing them; bend the arc hopefully
        but never flatter; no psychological jargon, no diagnosis; the passive
        must turn active by the end.
      model_tier: large
      output_schema:
        type: object
        required: [movements, full_portrait, key_quotes]
        properties:
          movements:
            type: array
            minItems: 6
            maxItems: 6
            items:
              type: object
              required: [title, text]
              properties:
                title: { type: string }
                text: { type: string }
          full_portrait:
            type: string
            description: The six movements joined into one continuous
              second-person portrait.
          key_quotes:
            type: array
            items: { type: string, x-verbatim: true }
            description: The user's own load-bearing words woven into the
              portrait.

confirm:
  present: structured_review
  authorize_language: >
    A first draft of you — and you're the author, so it's only true when you
    say it is. Rewrite as much as you want. Your success formula and your first
    moves grow out of this. After this we'll ask whether what you came here for
    still holds.

  authorize_language_i18n:
    ru: >
      Первый набросок тебя — и автор здесь ты, так что он становится правдой,
      только когда ты это скажешь. Переписывай сколько захочешь. Из него
      вырастают твоя формула успеха и первые шаги. Дальше мы спросим, в силе ли
      ещё то, с чем ты пришёл.

artifact:
  schema:
    type: object
    required: [movements, full_portrait]
    properties:
      movements: { type: array }
      full_portrait: { type: string }
      key_quotes: { type: array, items: { type: string } }
  render: |
    {{full_portrait}}

# Portrait and recipe need their full source sets before unlocking.
gate: all
