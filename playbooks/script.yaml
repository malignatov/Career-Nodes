id: script
version: 0.1.0
kind: derived
sector: induction
title: Script

purpose: >
  Finds the plot inside your favorite story. The story you love right now
  carries the script for your next chapter: someone like you, facing something
  like what you're facing, and a way through it. This is where who you are
  meets where you want to be. One caution worth keeping: stories are cultural
  products, so if the plot smuggles in a limit, we flag it for you to look at
  yourself. A story is an invitation, never an instruction. You edit all of it.

purpose_i18n:
  ru: >
    Находит сюжет внутри твоей любимой истории. История, которую ты любишь
    сейчас, несёт сценарий твоей следующей главы: кто-то вроде тебя, в чём-то
    похожем на то, где ты сейчас, и выход. Здесь тот, кто ты есть, встречается с
    тем, где ты хочешь быть. Одна оговорка, которую стоит держать в голове:
    истории — продукт культуры, и если в сюжет зашито ограничение, мы его
    отметим, чтобы ты сам на него посмотрел. История — это приглашение, а не
    инструкция. Правишь всё ты.

consumes:
  - favorite_story
  - character_sketch
  - preferred_settings
  - counseling_goal

invalidates:
  - life_portrait

induce:
  steps:
    - id: compose
      task: >
        From the favorite_story artifact — as the user retold it, using their
        key phrases — articulate the script for the user's next chapter: how a
        self like theirs (character_sketch) meets a setting like theirs
        (preferred_settings) and moves through a predicament like the one in
        the story. Address the user in the second person. Name the
        transformative scene — the moment in their telling where the turn
        happens — and state the credo the story carries (the idea a life like
        this serves). Then, gently and briefly, note anything in the script
        that could confine rather than free the user (gender expectations,
        prescribed endings, borrowed obligations) as questions for the user to
        judge, not corrections. Trace how the script turns passive into
        active. Never invent plot the user did not tell.
      model_tier: large
      output_schema:
        type: object
        required: [script_statement, transformative_scene, credo, passive_to_active]
        properties:
          script_statement:
            type: string
            description: Three to six second-person sentences — the storyline
              for the next chapter.
          transformative_scene: { type: string }
          credo:
            type: string
            description: The idea served by a life following this script.
          passive_to_active:
            type: string
            description: One sentence — from being influenced by the problem
              to influencing it.
          deconstruction_notes:
            type: ["string", "null"]
            description: Possible confining assumptions in the story, framed
              as open questions; null if none stand out.
          story_phrases:
            type: array
            items: { type: string, x-verbatim: true }
            description: The user's own phrases from the retelling that carry
              the script.

confirm:
  present: structured_review
  authorize_language: >
    A script is an invitation, not an instruction — rewrite anything that
    doesn't feel like your storyline. Your portrait builds on it.

  authorize_language_i18n:
    ru: >
      Сценарий — это приглашение, а не инструкция. Перепиши всё, что не похоже
      на твой сюжет. Твой портрет строится на этом.

artifact:
  schema:
    type: object
    required: [script_statement, transformative_scene, credo]
    properties:
      script_statement: { type: string }
      transformative_scene: { type: string }
      credo: { type: string }
      passive_to_active: { type: string }
      deconstruction_notes: { type: ["string", "null"] }
      story_phrases: { type: array, items: { type: string } }
  render: |
    {{script_statement}}
