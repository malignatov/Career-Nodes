id: closing_check
version: 0.1.0
kind: conversation
sector: action
title: Closing check

purpose: >
  The last step, straight from the book. What you asked for at the very start
  is read back to you word for word, and you — nobody else — decide whether you
  got it. Then you say what's different now, because saying it out loud is what
  makes it stick. And at the end your own motto comes back to you: the advice
  you were carrying the whole time, now with a journey behind it. This records
  your verdict. It changes nothing else.

purpose_i18n:
  ru: >
    Последний шаг, прямо из книги. То, с чем ты пришёл в самом начале,
    зачитывается тебе слово в слово, и ты — и никто другой — решаешь, получил ли
    ты это. Потом ты говоришь, что теперь иначе, потому что сказанное вслух и
    закрепляется. А в конце к тебе возвращается твой собственный девиз: совет,
    который ты нёс с собой всё это время, — теперь уже с пройденным путём за
    спиной. Здесь записывается твой вывод. Больше ничего не меняется.

consumes:
  - counseling_goal
  - action_recipe
  - motto

invalidates: []

elicit:
  share_upstream: true
  persona: |
    Warm, unhurried, glad — without flattering anyone. This is a closing, not
    another interview: something is finishing, and you can let that land. One
    question at a time. When you quote what they asked for at the start, or
    their motto, quote it exactly, word for word — never smooth it out, never
    paraphrase. The whole point is that they hear their own words back.
  guardrails:
    - The user is the only judge of whether their request was met. Accept
      "partly" and "no" with full respect and without defending the process.
    - Quote the counseling_goal request_verbatim and the motto exactly as they
      appear in the artifacts. Never edit, shorten, or improve them.
    - Do not open new counseling topics; if something big surfaces, note
      warmly that the map can be revisited any time.
  stages:
    - id: verdict
      goal: The user's own judgment on whether their original request was met.
      opening: >
        We've reached the end of the map. Ready to check the journey against
        where you started?
      opening_i18n:
        ru: >
          Мы дошли до конца карты. Готов сверить путь с тем, с чего ты начинал?
      probes:
        - when: the user is ready
          then: Read their original request back word for word from the
            counseling_goal artifact, then ask — did we get there?
        - when: the verdict is "partly" or "no"
          then: Ask what remains unanswered, and note which checkpoint on the
            map speaks to it — revisiting is how this process is meant to work.
      done_when:
        - The user has given a verdict on their original request — met,
          partly, or not.
    - id: difference
      goal: The change, said in the user's own words.
      # "when", not "the day": the book's cadence spreads this over sessions
      # weeks apart, where "the day you first answered" is literally true. This
      # journey can be finished in an afternoon — and was, in testing — so the
      # neutral wording is the one that stays true at four hours and four weeks.
      opening: >
        And compared with when you first answered that question — what's
        different now?
      opening_i18n:
        ru: >
          А если сравнить с твоим первым ответом на этот вопрос — что теперь
          иначе?
      probes:
        - when: the user answers abstractly
          then: Ask what they now do, or are about to do, that they weren't
            doing before.
      done_when:
        - The user has named at least one concrete difference.
    - id: sendoff
      goal: Hand the motto back and close.
      # The one stage in the whole journey that gives instead of asking. It ends
      # when it is said: nothing here feeds the artifact, and asking the user to
      # reply to a farewell only stands between them and the closing ceremony.
      terminal: true
      opening: >
        One last thing before you go.
      probes:
        - when: opening the send-off
          then: Tell the user they had the answer with them all along, quote
            their motto word for word from the motto artifact, and wish them
            well on the next chapter — briefly and warmly.
      done_when:
        - Nothing to check — a terminal stage closes on delivery.

induce:
  steps:
    - id: record
      task: >
        Record the closing verdict from the conversation. Quote the user's own
        words for the verdict and the difference they named.
      model_tier: small
      output_schema:
        type: object
        required: [goal_met, verdict_words, whats_different]
        properties:
          goal_met:
            type: string
            enum: [yes, partly, no]
          verdict_words:
            type: array
            minItems: 1
            items: { type: string, x-verbatim: true }
          whats_different:
            type: array
            minItems: 1
            items: { type: string, x-verbatim: true }
          remaining:
            type: ["string", "null"]
            description: What still feels unanswered, if the user said so;
              null otherwise.

confirm:
  present: structured_review
  authorize_language: >
    The journey is yours, and so is this record of it. Everything stays open —
    you can come back to any step, and start a new round whenever life asks for
    one.

  authorize_language_i18n:
    ru: >
      Путь твой, и эта запись о нём — тоже. Всё остаётся открытым: к любому шагу
      можно вернуться, а новый круг начать тогда, когда этого попросит жизнь.

artifact:
  schema:
    type: object
    required: [goal_met, verdict_words, whats_different]
    properties:
      goal_met: { type: string }
      verdict_words: { type: array, items: { type: string } }
      whats_different: { type: array, items: { type: string } }
      remaining: { type: ["string", "null"] }
  render: |
    {{goal_met}} — {{#each whats_different}}{{this}}; {{/each}}
