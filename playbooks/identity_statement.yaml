id: identity_statement
version: 0.1.0
kind: derived
sector: portrait
title: Identity statement

purpose: >
  One sentence you can actually carry — your success formula. The future is
  already sitting inside your portrait; this pulls it into a line you can say
  out loud. It usually starts "I will be happy and successful when I…", and
  it's built from phrases already in your own portrait. You'll see a few
  versions — pick one, reword it, or write your own. It only works if it's a
  sentence you'd really say.

purpose_i18n:
  ru: >
    Одно предложение, которое реально можно носить с собой, — твоя формула
    успеха. Будущее уже лежит внутри твоего портрета; этот шаг вытаскивает его в
    строчку, которую можно произнести вслух. Обычно она начинается со слов «Я
    буду счастлив и успешен, когда…» и собирается из фраз, уже звучавших в твоём
    портрете. Ты увидишь несколько вариантов — выбери один, переформулируй или
    напиши свой. Она работает, только если это предложение ты правда сказал бы.

consumes:
  - life_portrait
  - counseling_goal

invalidates:
  - action_recipe

induce:
  steps:
    - id: assemble
      task: >
        From the authorized life portrait, assemble two or three alternative
        success formulas — single first-person sentences following the shape
        "I will be happy and successful when I …" (adapt the template
        naturally to the session language and to how the user speaks about
        themselves). Build each from the portrait's own phrases: the strongest
        candidates borrow the user's verbs. Each candidate should carry the
        career theme and point the plot forward; together they should offer a
        real choice of emphasis, not three wordings of one sentence. At least
        one candidate should braid the portrait's strongest threads together
        (the craft AND what it wins the user) rather than expressing only one
        thread.
      model_tier: small
      output_schema:
        type: object
        required: [candidates, source_phrases]
        properties:
          candidates:
            type: array
            x-candidates: true
            minItems: 2
            maxItems: 3
            items: { type: string }
          source_phrases:
            type: array
            items: { type: string, x-verbatim: true }
            description: The portrait phrases the formulas were assembled from.

confirm:
  present: candidates
  choice_field: statement
  authorize_language: >
    This sentence is your compass — it's what you reach for at every confusing
    choice. Your first moves are built to serve it.

  authorize_language_i18n:
    ru: >
      Это предложение — твой компас: к нему ты будешь возвращаться на каждой
      непонятной развилке. Первые шаги строятся под него.

artifact:
  schema:
    type: object
    required: [statement]
    properties:
      statement: { type: string }
      source_phrases: { type: array, items: { type: string } }
  render: |
    {{statement}}
