id: advice_to_self
version: 0.1.0
kind: derived
sector: induction
title: Advice to self

purpose: >
  Unpacks your motto into the instruction it's been carrying all along. A
  favorite saying is self-help in the most literal sense — the best advice you
  have for yourself, usually stating your own strategy for getting to what's
  next. The answer was in your pocket already; this step just says it out loud.
  Your motto stays word for word yours, and you get it back at the very end.

purpose_i18n:
  ru: >
    Разворачивает твой девиз в указание, которое он всё это время нёс. Любимая
    поговорка — это самопомощь в самом прямом смысле: лучший совет, который у
    тебя есть для себя, и обычно он прямо описывает твою же стратегию перехода к
    следующему. Ответ и так лежал у тебя в кармане; этот шаг просто произносит
    его вслух. Девиз остаётся слово в слово твоим, и в самом конце он к тебе
    вернётся.

consumes:
  - motto
  - counseling_goal

invalidates:
  - life_portrait

induce:
  steps:
    - id: unpack
      task: >
        Take the motto exactly as recorded and unfold the advice it contains,
        addressed to the user in the second person. Connect it directly to the
        request in the counseling goal: how does this saying answer the very
        thing the user came here for? State the concrete move the motto is
        telling the user to make next. Do not improve, correct, or replace the
        motto — the wisdom must remain the user's own, only made explicit.
      model_tier: small
      output_schema:
        type: object
        required: [motto, call_to_action, answers_the_request]
        properties:
          motto:
            type: string
            x-verbatim: true
            description: The saying, exactly as the user recorded it.
          call_to_action:
            type: string
            description: Two or three second-person sentences — the move the
              motto is already advising.
          answers_the_request:
            type: string
            description: One or two sentences connecting the motto to the
              user's stated goal.

confirm:
  present: structured_review
  authorize_language: >
    Your own advice, said back to you plainly — adjust anything that isn't what
    you meant. Your portrait builds on it.

  authorize_language_i18n:
    ru: >
      Твой собственный совет, сказанный тебе прямо. Поправь всё, что ты имел в
      виду иначе. Твой портрет строится на этом.

artifact:
  schema:
    type: object
    required: [motto, call_to_action]
    properties:
      motto: { type: string }
      call_to_action: { type: string }
      answers_the_request: { type: string }
  render: |
    “{{motto}}” — {{call_to_action}}
