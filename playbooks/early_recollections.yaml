id: early_recollections
version: 0.1.0
kind: conversation
sector: interview
skippable: true
title: Early recollections

purpose: >
  Three of your earliest memories, from around ages three to six. For each one:
  what you felt, and a headline for it — like a newspaper headline, with a verb
  in it. Early memories aren't really history. The stories you reach for today
  say more about today than about back then. This is the most personal part of
  the whole thing, and you can skip it — say /skip before you share anything
  and it closes cleanly; the next step can work from the people you admired
  instead. Your memories don't have to be accurate. Whatever comes to mind
  counts. We record your stories and the headlines you approve, nothing more.

purpose_i18n:
  ru: >
    Три самых ранних воспоминания, примерно из возраста трёх-шести лет. К
    каждому: что ты чувствовал и какой у него заголовок — как в газете,
    обязательно с глаголом. Ранние воспоминания — это не совсем история. То,
    какие истории всплывают сегодня, говорит больше о сегодняшнем дне, чем о том
    времени. Это самая личная часть всего процесса, и её можно пропустить —
    напиши /skip до того, как что-то расскажешь, и шаг закроется спокойно;
    дальше можно опереться на тех, кем ты восхищался. Воспоминания не обязаны
    быть точными. Годится всё, что приходит в голову. Мы записываем твои истории
    и заголовки, которые ты принял, — и больше ничего.

consumes:
  - counseling_goal

invalidates:
  - perspective

elicit:
  persona: |
    Quiet, unhurried, steady. This part deserves more care than anything else
    here, and the right instinct is almost always to say less. Ask one question
    at a time. Receive each story without commentary — no praise, no reading
    into it, no "that must have been hard." Leave the silence alone, and never
    rush them.
  guardrails:
    - This is the most personal question of the interview. Before the first
      story, remind the user once that they can skip or pause at any time and
      that skipping is completely fine.
    - If a painful or traumatic memory surfaces, acknowledge it with warmth and
      care, do not probe deeper into the pain, and remind the user they choose
      whether to continue, move to a different memory, or skip.
    - If the user expresses acute distress or mentions self-harm, respond with
      care, provide crisis resources, and pause the interview.
    - Never interpret, analyze, or connect memories to the user's career during
      the conversation. Collect the stories only.
    - Whatever the user recalls counts — fragments, images, and uncertain
      memories are all valid. Never question accuracy.
  stages:
    - id: stories
      goal: Three early recollections, each with the feeling the user
        experienced in it.
      opening: >
        What are your earliest recollections? I'm interested in hearing three
        stories about things you recall happening to you when you were about
        three to six years old — or as early as you can remember.
      opening_i18n:
        ru: >
          Какие твои самые ранние воспоминания? Мне интересно услышать три
          истории о том, что случалось с тобой лет в три–шесть — или так рано,
          как ты только можешь вспомнить.
      probes:
        - when: only a fragment or image comes
          then: Welcome it — ask them to describe the scene as they see it.
        - when: a story has been told without a feeling
          then: Ask what feeling they experienced when that happened.
        - when: fewer than three stories have been told
          then: Ask gently what else they recall from those early years.
        - when: the user hesitates or goes quiet
          then: Give them room — offer that they can take their time, move to a
            different memory, or skip.
      done_when:
        - Three early recollections have been told.
        - Each recollection has a feeling named by the user.
    - id: headlines
      goal: A user-approved headline containing a verb, for each of the three
        stories.
      opening: >
        Let's give each story a headline — as if it appeared in tomorrow's
        newspaper. What headline captures the first one? Try to include a verb.
      probes:
        - when: the user draws a blank
          then: Offer two or three headline suggestions built only from their
            own words, and let them adjust until one feels right.
        - when: a headline has no verb
          then: Note that a headline gets its energy from a verb, and ask them
            to work one in.
        - when: a headline is settled
          then: Move to the next story's headline.
      # "the stories that were TOLD", never "the three": this step is
      # skippable and a client may share one story, or two. A count fixed at
      # three deadlocked the stage — headlines could never all exist, the
      # checker could never pass, and the interview had no way forward.
      done_when:
        - Each story that was actually told has a headline the user approved —
          one story means one headline, two mean two.
        - Each headline contains a verb.

induce:
  steps:
    - id: extract
      task: >
        Structure the recollections in the order told — the three asked for,
        plus any extra story the user offered and asked to keep. For each: the
        feeling, the approved headline, and the headline's main verb. Feelings
        and headlines come only from the transcript: the feeling must be one
        the user actually named (null when none was named — never substitute a
        scene phrase or a thought), and the headline must be wording the user
        approved in conversation (null when a story never received one — never
        compose one yourself).
      model_tier: small
      temperature: 0.2
      output_schema:
        type: object
        required: [recollections]
        properties:
          recollections:
            type: array
            minItems: 0
            maxItems: 5
            items:
              type: object
              required: [order, scene_phrases, feeling, headline, headline_verb]
              properties:
                order: { type: integer }
                scene_phrases:
                  type: array
                  minItems: 1
                  items: { type: string, x-verbatim: true }
                  description: The load-bearing phrases of the story as told.
                feeling:
                  type: [string, "null"]
                  x-verbatim: true
                  description: Null when the user never named a feeling for this story.
                headline:
                  type: [string, "null"]
                  description: The wording the user approved in conversation
                    (it may have been co-authored, so it is not checked against
                    the user's turns alone).
                headline_verb: { type: [string, "null"] }
      validation:
        - Each non-null headline must be exactly the wording the user approved,
          and must contain a verb.
    - id: salience
      task: >
        Record the first verb of the first recollection as told, and note in
        one sentence whether the three stories read as problem, then
        intensification, then resolution — or another order. No interpretation
        beyond that single observation.
      model_tier: small
      temperature: 0.2
      output_schema:
        type: object
        required: [first_verb_of_first_story, sequence_reading]
        properties:
          first_verb_of_first_story: { type: string, x-verbatim: true }
          sequence_reading: { type: string }

confirm:
  present: structured_review
  authorize_language: >
    Your stories and your headlines, organized — nothing has been interpreted.
    Change anything that doesn't match how you told it. Nothing gets built from
    this but what you approve, and you can come back and remove any of it
    whenever you want.

  authorize_language_i18n:
    ru: >
      Твои истории и твои заголовки, разложенные по местам, — ничего не
      истолковано. Поменяй всё, что не совпадает с тем, как ты рассказывал.
      Дальше строится только на том, что ты принял, и ты можешь вернуться и
      убрать что угодно в любой момент.

artifact:
  schema:
    type: object
    required: [recollections, first_verb_of_first_story]
    properties:
      recollections: { type: array }
      first_verb_of_first_story: { type: string }
      sequence_reading: { type: string }
  render: |
    {{#each recollections}}{{order}}. “{{headline}}” — {{feeling}}
    {{/each}}
