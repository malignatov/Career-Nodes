id: perspective
version: 0.1.0
kind: derived
sector: induction
title: Perspective

purpose: >
  Reads your earliest memories as stories about now. They aren't history —
  they show the angle you're seeing your current situation from, and often the
  question your life keeps answering. The first story tends to be the present
  problem in miniature. The sequence often moves from problem toward a way out.
  Your own headlines carry the themes. If you skipped the memories, this gets
  worked out from the people you admired instead — admiring courage usually
  means fear was familiar. None of this is a verdict. You edit every word.

purpose_i18n:
  ru: >
    Читает твои самые ранние воспоминания как истории про сейчас. Они не история
    — они показывают ракурс, с которого ты смотришь на нынешнюю ситуацию, и
    часто тот вопрос, на который твоя жизнь всё время отвечает. Первая история
    обычно оказывается нынешней проблемой в миниатюре. Последовательность часто
    идёт от проблемы к выходу. Твои же заголовки несут основные темы. Если ты
    пропустил воспоминания, всё это выводится из тех, кем ты восхищался:
    восхищение смелостью обычно значит, что страх был знаком. Ничего из этого не
    приговор. Каждое слово правишь ты.

consumes:
  - early_recollections
  - role_models
  - counseling_goal

invalidates:
  - character_sketch
  - life_portrait

induce:
  steps:
    - id: read
      task: >
        Compose the user's perspective on their current transition from the
        early_recollections artifact. Treat the first recollection as a
        possible précis of the present problem stated in the counseling goal;
        weigh the first verb heavily; when the user gave several
        recollections, read them as a sequence (often problem,
        intensification, resolution — note if the order differs); when the
        user gave a single memory with several headlines, the headlines are
        alternative titles for that one memory — never narrate them as
        separate memories. Use the user's own headlines as leitmotifs and
        quote them exactly. Address the user in the second person. If early_recollections
        is absent, infer the preoccupation from the role models instead: the
        admired characteristics are solutions, so name the problem they solve
        (bravery implies fear, independence implies dependence). Never
        diagnose; frame everything as a perspective the user may recognize —
        or correct.
      model_tier: large
      output_schema:
        type: object
        required: [perspective_statement, preoccupation, first_story_reading, leitmotifs]
        properties:
          perspective_statement:
            type: string
            description: Two to five second-person sentences — the vantage
              point from which the user views the current transition.
          preoccupation:
            type: string
            description: The recurring concern at the base of the character
              arc, named gently.
          first_story_reading:
            type: ["string", "null"]
            description: How the first recollection frames the present problem;
              null when derived from role models.
          leitmotifs:
            type: array
            items: { type: string, x-verbatim: true }
            description: The user's own headline words or recurring phrases.

confirm:
  present: structured_review
  authorize_language: >
    This is a way of seeing, not a verdict — reword anything that doesn't feel
    like your own view. What comes next builds on it.

  authorize_language_i18n:
    ru: >
      Это способ смотреть, а не приговор — переформулируй всё, что не похоже на
      твой собственный взгляд. Дальше строится на этом.

artifact:
  schema:
    type: object
    required: [perspective_statement, preoccupation]
    properties:
      perspective_statement: { type: string }
      preoccupation: { type: string }
      first_story_reading: { type: ["string", "null"] }
      leitmotifs: { type: array, items: { type: string } }
  render: |
    {{perspective_statement}}
