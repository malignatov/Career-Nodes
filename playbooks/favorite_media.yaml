id: favorite_media
version: 0.1.0
kind: conversation
sector: interview
title: Favorite media

purpose: >
  Two or three shows, series, games, channels, sites, or newsletters you keep
  going back to. What you choose to spend time in says a lot about the kind of
  places, people, and problems you want around you — and it's far more honest
  than any interest quiz, because nobody is watching you answer. We record your
  favorites and what pulls you in, in your words. The next step turns it into a
  picture of where you work best.

purpose_i18n:
  ru: >
    Два-три сериала, канала, игры, сайта или рассылки, к которым ты
    возвращаешься. То, на что ты сам тратишь время, много говорит о том, какие
    места, люди и задачи тебе нужны рядом, — и это честнее любого теста на
    интересы, потому что никто не смотрит тебе через плечо. Мы записываем твои
    любимые вещи и то, чем они тебя цепляют, твоими словами. На следующем шаге
    из этого сложится картина того, где тебе работается лучше всего.

consumes:
  - counseling_goal

invalidates:
  - preferred_settings

elicit:
  persona: |
    Easy, warm curiosity — this is the lightest part of the whole thing, closer
    to two people comparing what they watch than to an interview. Talk in the
    language of liking: what do you enjoy, what pulls you in, what do you go
    back to. One question at a time, and keep it light — nobody needs to justify
    their taste to you.
  guardrails:
    - Never judge or rank the user's taste; a soap opera reveals as much as a
      documentary.
    - Never suggest what might attract the user to something — the attraction
      must be stated in their words.
    - Do not interpret or classify anything during the conversation; collect only.
  stages:
    - id: collect
      goal: Two or three favorite media the user returns to regularly.
      opening: >
        What do you keep returning to — series or shows, games, YouTube
        channels? Which ones?
      opening_i18n:
        ru: >
          К чему ты регулярно возвращаешься — сериалы или передачи, игры,
          YouTube-каналы? Что именно?
      probes:
        - when: the user doesn't watch or play much
          then: Ask which websites they visit again and again.
        - when: websites also draw a blank
          then: Ask about magazines, journals, newsletters, or podcasts they follow.
        - when: only one favorite has been named
          then: Ask for one or two more.
      done_when:
        - The user has named two or three regular favorites.
    - id: attractions
      goal: What specifically attracts the user to each favorite.
      opening: >
        What do you like about {{item}}? What attracts you to it?
      probes:
        - when: the user names a general-interest magazine or site
          then: Ask which section they read first.
        - when: the answer is vague ("it's fun", "it's good")
          then: Ask what specifically they enjoy most about it.
        - when: the user only summarizes the plot
          then: Ask what it is about the world of that show they enjoy spending
            time in.
        - when: the stated attraction is social — friends play or watch it,
            being part of the community
          then: Honor that, then ask what about the thing itself draws them —
            the world, the activity, the stories — or whether it truly is the
            people alone.
      done_when:
        - Each of the two or three favorites named earlier has at least one
          attraction, stated in the user's own words about THAT favorite — an
          attraction given for one favorite never counts for another.

induce:
  steps:
    - id: extract
      task: >
        Structure the favorites with their attractions in the order named.
        Attractions come only from what the user actually said about that
        favorite — anywhere in the transcript, parentheticals included; when
        the user never stated an attraction for a favorite, leave its
        attractions as an empty array. Never infer one, and never reuse
        another favorite's attraction. Keep social pulls ('my friends play
        it') distinct from attraction to the thing itself — record each
        exactly as stated, never converting one into the other.
      model_tier: small
      temperature: 0.2
      output_schema:
        type: object
        required: [media]
        properties:
          media:
            type: array
            minItems: 2
            items:
              type: object
              required: [title, medium, attractions, named_order]
              properties:
                title: { type: string }
                medium:
                  type: string
                  enum: [tv, series, game, youtube, website, magazine, journal, newsletter, podcast, other]
                attractions:
                  type: array
                  x-own: true   # said about THIS favorite, not a sibling
                  minItems: 1
                  items: { type: string, x-verbatim: true }
                named_order: { type: integer }
    - id: riasec
      task: >
        Classify each favorite's STATED ATTRACTION into the RIASEC taxonomy
        using only the book's definitions: R Realistic (mechanical, outdoor,
        making and repairing), I Investigative (scientific, analytic, solving
        mysteries), A Artistic (creative, aesthetic, performing), S Social
        (caring, conversational, educational), E Enterprising (managerial,
        political, persuasive), C Conventional (office, organizing,
        systematized). Reference examples: This Old House is R, CSI is I,
        America's Got Talent is A, Friends is S, Shark Tank is E, Martha
        Stewart is C. The code follows the user's stated attraction, never the
        title's genre or your own reading of the medium: a science-fiction
        series loved because "the shows are imaginative" is A, even though
        science fiction sounds Investigative; a magazine read for its politics
        sections is E, because the pull is the political world, not the act of
        reading or analysis. When attraction and genre disagree, the
        attraction wins. overall_codes are the one or two codes that dominate
        the stated attractions.
      model_tier: small
      temperature: 0.2
      output_schema:
        type: object
        required: [classified, overall_codes]
        properties:
          classified:
            type: array
            items:
              type: object
              required: [title, code, rationale]
              properties:
                title: { type: string }
                code: { type: string, enum: [R, I, A, S, E, C] }
                rationale: { type: string }
          overall_codes:
            type: array
            minItems: 1
            maxItems: 2
            items: { type: string, enum: [R, I, A, S, E, C] }

confirm:
  present: structured_review
  authorize_language: >
    Your favorites, and your own words for what pulls you in — plus a first
    rough read on the setting. Fix anything that feels off before we build on it.

  authorize_language_i18n:
    ru: >
      Твои любимые вещи и твои слова о том, чем они цепляют, — плюс первая
      грубая прикидка среды. Поправь всё, что звучит не так, прежде чем мы будем
      на этом строить.

artifact:
  schema:
    type: object
    required: [media, classified, overall_codes]
    properties:
      media: { type: array }
      classified: { type: array }
      overall_codes: { type: array }
  render: |
    {{#each media}}• {{title}} ({{medium}}): {{#each attractions}}{{this}}; {{/each}}{{/each}}
    Codes: {{overall_codes}}
