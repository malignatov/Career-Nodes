id: counseling_goal
version: 0.1.0
kind: conversation
sector: goal
title: Counseling goal

purpose: >
  Say what you want out of this, in your own words. Everything after this gets
  built around that answer — and at the very end it's read back to you to ask:
  did we get there? Nothing here gets analyzed. We restate what you said, and
  you check the restatement. You can change the goal later; your original
  wording is kept either way, for that last step.

purpose_i18n:
  ru: >
    Скажи своими словами, чего ты хочешь от всего этого. Дальше всё строится
    вокруг твоего ответа — а в самом конце он зачитывается тебе обратно с
    вопросом: получилось? Здесь ничего не анализируется. Мы пересказываем то,
    что ты сказал, а ты проверяешь пересказ. Запрос можно поменять позже;
    исходная формулировка сохраняется в любом случае — для последнего шага.

consumes: []

# The goal parameterizes every induced node, but none of the raw conversations.
invalidates:
  - perspective
  - character_sketch
  - preferred_settings
  - script
  - advice_to_self
  - life_portrait
  - identity_statement
  - action_recipe

# After the life portrait is authorized, the app offers a goal amendment:
# "Now that you've seen your portrait — is this still the question?"
# Amendments are versioned; request_verbatim is immutable.
amendable_after: life_portrait

elicit:
  persona: |
    You're opening the first conversation, and your job is to find out what this
    person actually wants. Warm, brief, unhurried — you have time, and they can
    feel it. One question at a time. Match their length: if they answer in a
    line, don't reply in a paragraph. In this phase you never analyze, diagnose,
    or advise. When you reflect something back, use their own words, not
    smoother ones.

  guardrails:
    - Never propose or suggest goals; only ask and reflect.
    - If the user asks for a test or personality assessment, explain in one
      sentence that this process works through their own stories instead, then
      return to the question.
    - Listen for the request behind the request, and ask about it — but the user
      decides what their goal is. Do not overrule their framing.
    - If the user expresses acute distress or mentions self-harm, acknowledge with
      care, provide crisis resources, and pause the interview.

  stages:
    - id: open
      goal: Capture the request in the user's own words.
      opening: >
        How can this process be useful to you as you construct your career?
      opening_i18n:
        ru: >
          Чем этот процесс может быть полезен тебе в построении твоей карьеры?
      probes:
        - when: the answer is a single broad phrase ("figure things out",
            "career change", "find my path")
          then: Ask what would make this genuinely worth their time.
        - when: several distinct requests appear
          then: Reflect the list back in their words and ask which matters most
            right now.
        - when: the request is about making a decision
          then: Ask gently whether the hard part is making the choice, or
            understanding what is blocking the choice. Clients who ask for help
            choosing often actually want to know what holds them back.
        - when: the request sounds like confirming a decision already made
          then: Ask what kind of reassurance would help, and from whom.
      done_when:
        - The user has stated a request in at least one full sentence.

    - id: success
      goal: Elicit at least one concrete success criterion.
      opening: >
        Imagine we finish and it was worth it. What are you walking away with?
      probes:
        - when: the answer restates the goal abstractly
          then: Ask what they would do differently the following week if this
            worked.
      done_when:
        - At least one concrete success criterion has been stated.

    - id: wrap
      goal: Reflect and close.
      opening: >
        Reflect the request and success criteria back in the user's own words and
        ask whether anything is missing.
      done_when:
        - The user has confirmed the reflection or finished adding to it.

induce:
  steps:
    - id: extract
      task: >
        Extract the goal fields from the transcript with strict field
        discipline: request_verbatim is the user's answer to the OPENING
        question — the request exactly as first stated, never a later
        restatement and never the success answer; success_criteria come only
        from the answers about what would make the process worth it;
        feelings_mentioned holds only the emotion words the user actually used
        (a whole sentence is not a feeling). When unsure which field a quote
        belongs to, follow the order of the conversation.
      model_tier: small
      temperature: 0.2
      output_schema:
        type: object
        required: [request_verbatim, success_criteria, request_type]
        properties:
          request_verbatim:
            type: string
            x-verbatim: true
            description: The user's request exactly as they first stated it.
          success_criteria:
            type: array
            items: { type: string, x-verbatim: true }
            minItems: 1
          request_type:
            type: string
            # Provenance — Savickas, Career Counseling (2nd ed.), "Review the
            # Client's Goals" (pp. 77–78). The book names no closed taxonomy;
            # this enum distills its three client examples plus the theory's
            # framing of why clients come:
            #   make_a_choice / understand_whats_blocking — the client who asked
            #     for help making a choice but first "wanted to know what was
            #     holding her back" (also the source of the choice-vs-blocked
            #     probe in the elicit stage above);
            #   reassurance — the client who "wanted reassurance that he had
            #     selected the right graduate program";
            #   transition_or_dislocation — the book's own language: "some
            #     circumstance has dislocated their occupational plot from its
            #     career theme";
            #   meaning_or_direction, other — this app's additions.
            enum:
              - make_a_choice
              - understand_whats_blocking
              - reassurance
              - meaning_or_direction
              - transition_or_dislocation
              - other
          feelings_mentioned:
            type: array
            items: { type: string, x-verbatim: true }

    - id: restate
      task: >
        Draft alternative one-sentence restatements of the goal, each assembled
        only from the user's own phrases.
      model_tier: small
      temperature: 0.2
      output_schema:
        type: object
        required: [candidates]
        properties:
          candidates:
            type: array
            x-candidates: true
            minItems: 2
            maxItems: 3
            items: { type: string }
      validation:
        - Every content-bearing phrase in each candidate must appear verbatim in
          the transcript; connective words may be added.

confirm:
  present: candidates
  choice_field: restated_goal
  authorize_language: >
    This is the question we keep coming back to. You can change it once you've
    seen your portrait — your original wording stays saved either way.

  authorize_language_i18n:
    ru: >
      Это вопрос, к которому мы будем возвращаться. Его можно поменять, когда
      увидишь свой портрет, — исходная формулировка всё равно сохранится.

artifact:
  schema:
    type: object
    required: [request_verbatim, restated_goal, success_criteria, request_type]
    properties:
      request_verbatim: { type: string }
      restated_goal: { type: string }
      success_criteria:
        type: array
        items: { type: string }
      request_type: { type: string }
      feelings_mentioned:
        type: array
        items: { type: string }
      amendments:
        type: array
        items:
          type: object
          properties:
            date: { type: string }
            restated_goal: { type: string }
            reason: { type: string }
  render: |
    “{{request_verbatim}}”
    → {{restated_goal}}
    Worth it if: {{#each success_criteria}}{{this}}; {{/each}}
