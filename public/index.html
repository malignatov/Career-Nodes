<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Career Counseling — map</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Career construction — your map</h1>
    <div class="legend">
      <span><i class="dot authorized"></i> authorized</span>
      <span><i class="dot in_progress"></i> in progress</span>
      <span><i class="dot available"></i> ready</span>
      <span><i class="dot planned"></i> planned</span>
    </div>
  </header>
  <main>
    <section id="map" aria-label="Journey map"></section>
    <aside id="panel" class="empty">
      <p class="hint">Select a checkpoint on the map to see what happens there — and to start the conversation.</p>
    </aside>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
