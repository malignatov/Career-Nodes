<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Braid UI tests</title>
  <!-- Real field styles: material classes, recession rules, loader keyframes. -->
  <!-- Both sheets, in the order index.html loads them: the readout and the
       entity blocks live in style.css, and braid.css lands last on purpose. -->
  <link rel="stylesheet" href="../../public/style.css" />
  <link rel="stylesheet" href="../../public/braid.css" />
  <style>html, body { margin: 0; } #journey { width: 1280px; height: 800px; position: relative; }</style>
</head>
<body>
  <main id="journey"></main>
  <script>
    // Deterministic network: the braid's playbook/session fetches resolve
    // fast and empty instead of touching anything. A scenario that needs a
    // real reply parks one in __net under the path it will be asked for.
    window.__net = {};
    window.fetch = async (url) => {
      const body = window.__net[String(url)];
      return body === undefined
        ? { ok: false, json: async () => ({}) }
        : { ok: true, json: async () => body };
    };
  </script>
  <script src="../../public/braid.js"></script>
  <script type="module" src="./driver.mjs"></script>
</body>
</html>
